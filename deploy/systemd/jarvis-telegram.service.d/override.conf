# systemd watchdog for the Telegram daemon. The loop pings WATCHDOG=1 on
# every pass (jarvis_telegram.beat). If no ping arrives for 45 minutes,
# systemd sends SIGABRT, faulthandler writes the stuck stack to the journal,
# and Restart=on-failure starts it again. 45 minutes covers the longest
# normal pass (the 05:30 plan build's Claude call with retries).
#
# vps-deploy.sh does not install drop-ins. Install by hand:
#   sudo systemctl edit jarvis-telegram     (paste the [Service] lines below)
# or
#   sudo mkdir -p /etc/systemd/system/jarvis-telegram.service.d
#   sudo cp deploy/systemd/jarvis-telegram.service.d/override.conf /etc/systemd/system/jarvis-telegram.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart jarvis-telegram
# Check: systemctl show jarvis-telegram -p WatchdogUSec -p NotifyAccess

[Service]
NotifyAccess=main
WatchdogSec=45min
